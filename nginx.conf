http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for" '
    '"$upstream_addr"';

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log main;

    server {
        listen 80;

        location / {
            root /public;
            try_files $uri @backend;
        }

        location /images/ {
            alias /images/;
            autoindex off;
        }

        location @backend {
            proxy_pass https://https://app.internal.mangocoast-c7cda31b.centralindia.azurecontainerapps.io;
            proxy_set_header Host https://app.internal.mangocoast-c7cda31b.centralindia.azurecontainerapps.io;
            proxy_ssl_name https://app.internal.mangocoast-c7cda31b.centralindia.azurecontainerapps.io;
        }
    }
}

events {
}
